[project]
name = "ai-experiments"
version = "0.1.0"
description = "One question at a time, measured on a public benchmark, with the exact request and response kept for every call"
authors = [
    { name = "Nadeem Khan", email = "nadeem4.nk13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0",
    "pyarrow>=21",
    "rank-bm25>=0.2.2",
    "pytrec-eval-terrier>=0.5.7",
    "laya>=0.3.5",
    "sentence-transformers>=5.0",
    "torch>=2.0",
    "matplotlib>=3.9",
]

[project.scripts]
exp = "exp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
# The CLI is what this project installs; the experiments are run from the
# source tree, not distributed.
module-name = "exp"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "kaggle>=2.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "rerank/tests", "banking77/tests", "typed_decisions/tests"]
