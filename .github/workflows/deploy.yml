name: Deploy the lab site

# Publishes site/ to lab.codewithnk.com on every push to main.
#
# This exists instead of Vercel's GitHub integration so that publishing needs
# nothing but a token: no per-repository app grant, and the same file can be
# copied into the next experiment's repo with two ids changed.
#
# One secret is required, once per repository:
#   VERCEL_TOKEN   https://vercel.com/account/tokens
# The two ids below are identifiers rather than credentials, so they are in
# plain sight deliberately: it keeps setup to a single secret.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_JEOpD4bpz5gHi1OICXFkxXUj
  VERCEL_PROJECT_ID: prj_wH5EKEzAKU4ddNrJdgIs2JuvQ6CD

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # The checks run before the deploy, so a red build never reaches the site.
      - run: npm run lint
      - run: npm test

      - run: npm i -g vercel@latest

      - name: Pull the project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
